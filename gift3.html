<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Precious Memories 💕</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Poppins:wght@300;400;600&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 40px 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Floating hearts background */
        .hearts-bg {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .floating-heart {
            position: absolute;
            font-size: 20px;
            opacity: 0.2;
            animation: floatHeart 15s infinite ease-in-out;
        }

        @keyframes floatHeart {

            0%,
            100% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }

            10% {
                opacity: 0.3;
            }

            50% {
                opacity: 0.2;
            }

            90% {
                opacity: 0;
            }

            100% {
                transform: translateY(-100px) rotate(360deg);
            }
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .header {
            text-align: center;
            margin-bottom: 60px;
            animation: fadeInDown 1s ease;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            font-family: 'Caveat', cursive;
            font-size: 4.5em;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 15px;
            text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
        }

        .subtitle {
            font-size: 1.3em;
            color: #555;
            font-weight: 300;
            font-style: italic;
        }

        /* Photo Gallery Grid */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 40px;
            padding: 20px;
        }

        /* Polaroid Card Style */
        .memory-card {
            background: white;
            padding: 15px 15px 45px 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            position: relative;
            animation: fadeInUp 0.8s ease both;
        }

        .memory-card:nth-child(odd) {
            transform: rotate(-2deg);
        }

        .memory-card:nth-child(even) {
            transform: rotate(2deg);
        }

        .memory-card:hover {
            transform: rotate(0deg) scale(1.05) translateY(-10px);
            box-shadow: 0 20px 60px rgba(102, 126, 234, 0.4);
            z-index: 10;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(50px) rotate(0deg);
            }

            to {
                opacity: 1;
            }
        }

        /* Stagger animation delays */
        .memory-card:nth-child(1) {
            animation-delay: 0.1s;
        }

        .memory-card:nth-child(2) {
            animation-delay: 0.2s;
        }

        .memory-card:nth-child(3) {
            animation-delay: 0.3s;
        }

        .memory-card:nth-child(4) {
            animation-delay: 0.4s;
        }

        .memory-card:nth-child(5) {
            animation-delay: 0.5s;
        }

        .memory-card:nth-child(6) {
            animation-delay: 0.6s;
        }

        .memory-card:nth-child(7) {
            animation-delay: 0.7s;
        }

        .memory-card:nth-child(8) {
            animation-delay: 0.8s;
        }

        .image-container {
            width: 100%;
            height: 220px;
            overflow: hidden;
            background: linear-gradient(135deg, #e0e0e0, #f5f5f5);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .memory-card:hover .image-container img {
            transform: scale(1.1);
        }

        /* Placeholder for empty images */
        .placeholder {
            font-size: 4em;
            color: #ddd;
        }

        .caption {
            margin-top: 15px;
            text-align: center;
            font-family: 'Caveat', cursive;
            font-size: 1.5em;
            color: #333;
            line-height: 1.4;
        }

        .date {
            position: absolute;
            bottom: 15px;
            right: 20px;
            font-size: 0.9em;
            color: #999;
            font-weight: 300;
        }

        /* Tape effect */
        .memory-card::before {
            content: '';
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 25px;
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(0, 0, 0, 0.1);
            border-left: 1px dashed rgba(0, 0, 0, 0.1);
            border-right: 1px dashed rgba(0, 0, 0, 0.1);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        /* Back button */
        .back-button {
            position: fixed;
            bottom: 30px;
            left: 30px;
            z-index: 1000;
        }

        .back-button button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 35px;
            border-radius: 50px;
            border: none;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
            transition: all 0.3s ease;
        }

        .back-button button:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(102, 126, 234, 0.6);
        }

        .back-button button:active {
            transform: translateY(0);
        }

        /* Lightbox Modal */
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .lightbox.active {
            display: flex;
        }

        .lightbox-content {
            max-width: 90%;
            max-height: 90%;
            position: relative;
            animation: zoomIn 0.3s ease;
        }

        @keyframes zoomIn {
            from {
                transform: scale(0.8);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .lightbox img {
            max-width: 100%;
            max-height: 90vh;
            box-shadow: 0 0 50px rgba(255, 255, 255, 0.2);
        }

        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 3em;
            color: white;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .lightbox-close:hover {
            transform: scale(1.2);
        }

        .lightbox-caption {
            text-align: center;
            color: white;
            font-family: 'Caveat', cursive;
            font-size: 2em;
            margin-top: 20px;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 3em;
            }

            .gallery {
                grid-template-columns: 1fr;
                gap: 30px;
            }

            .back-button {
                bottom: 20px;
                left: 50%;
                transform: translateX(-50%);
            }

            .image-container {
                height: 200px;
            }
        }
    </style>
</head>

<body>
    <!-- Floating hearts background -->
    <div class="hearts-bg" id="heartsBackground"></div>

    <div class="container">
        <div class="header">
            <h1>Our Beautiful Memories 💕</h1>
            <p class="subtitle">"Every moment with you is a treasure I hold close to my heart"</p>
        </div>

        <div class="gallery" id="gallery">
            <!-- Memory Card 1 -->
            <div class="memory-card">
                <div class="image-container">
                    <div class="placeholder">
                        <img src="https://media.istockphoto.com/id/636379014/photo/hands-forming-a-heart-shape-with-sunset-silhouette.jpg?s=612x612&w=0&k=20&c=CgjWWGEasjgwia2VT7ufXa10azba2HXmUDe96wZG8F0="
                            alt="">
                    </div>
                </div>
                <div class="caption">Our First Adventure Together</div>
                <!-- <div class="date">Coming Soon...</div> -->
            </div>

            <!-- Memory Card 2 -->
            <div class="memory-card">
                <div class="image-container">
                    <div class="placeholder">💑</div>
                </div>
                <div class="caption">That Special Day</div>
                <!-- <div class="date">Coming Soon...</div> -->
            </div>

            <!-- Memory Card 3 -->
            <div class="memory-card">
                <div class="image-container">
                    <div class="placeholder">🌅</div>
                </div>
                <div class="caption">Sunset Moments</div>
                <!-- <div class="date">Coming Soon...</div> -->
            </div>

            <!-- Memory Card 4 -->
            <div class="memory-card">
                <div class="image-container">
                    <div class="placeholder">🎂</div>
                </div>
                <div class="caption">Celebration Time</div>
                <!-- <div class="date">Coming Soon...</div> -->
            </div>

            <!-- Memory Card 5 -->
            <div class="memory-card">
                <div class="image-container">
                    <div class="placeholder">❤️</div>
                </div>
                <div class="caption">Just Us</div>
                <!-- <div class="date">Coming Soon...</div> -->
            </div>

            <!-- Memory Card 6 -->
            <div class="memory-card">
                <div class="image-container">
                    <div class="placeholder">🌟</div>
                </div>
                <div class="caption">Making Memories</div>
                <!-- <div class="date">Coming Soon...</div> -->
            </div>

            <!-- Memory Card 7 -->
            <div class="memory-card">
                <div class="image-container">
                    <div class="placeholder">💝</div>
                </div>
                <div class="caption">Forever Moments</div>
                <!-- <div class="date">Coming Soon...</div> -->
            </div>

            <!-- Memory Card 8 -->
            <div class="memory-card">
                <div class="image-container">
                    <div class="placeholder">✨</div>
                </div>
                <div class="caption">More to Come...</div>
                <!-- <div class="date">Coming Soon...</div> -->
            </div>
        </div>
    </div>

    <!-- Back Button -->
    <div class="back-button">
        <button onclick="window.location.href='gifts.html'">← Back to Gifts</button>
    </div>

    <!-- Lightbox Modal -->
    <div class="lightbox" id="lightbox">
        <span class="lightbox-close">×</span>
        <div class="lightbox-content" onclick="event.stopPropagation()">
            <img id="lightboxImage" src="" alt="Memory">
            <div class="lightbox-caption" id="lightboxCaption"></div>
        </div>
    </div>

    <script>
        // Create floating hearts
        const heartsBackground = document.getElementById('heartsBackground');
        for (let i = 0; i < 20; i++) {
            const heart = document.createElement('div');
            heart.className = 'floating-heart';
            heart.textContent = '❤️';
            heart.style.left = Math.random() * 100 + '%';
            heart.style.animationDelay = Math.random() * 15 + 's';
            heart.style.animationDuration = (Math.random() * 10 + 10) + 's';
            heartsBackground.appendChild(heart);
        }

        // Lightbox functionality
        const memories = [
            { caption: 'Our First Adventure Together' },
            { caption: 'That Special Day' },
            { caption: 'Sunset Moments' },
            { caption: 'Celebration Time' },
            { caption: 'Just Us' },
            { caption: 'Making Memories' },
            { caption: 'Forever Moments', },
            { caption: 'More to Come...', }
        ];

        function openLightbox(index) {
            // For now, just show a message since images are placeholders
            const lightbox = document.getElementById('lightbox');
            const caption = document.getElementById('lightboxCaption');

            caption.textContent = memories[index].caption + ' - ' + memories[index].date;

            // You can add actual images later by setting:
            // document.getElementById('lightboxImage').src = 'path/to/image.jpg';

            lightbox.classList.add('active');
        }

        function closeLightbox() {
            const lightbox = document.getElementById('lightbox');
            lightbox.classList.remove('active');
        }

        // Close lightbox with Escape key
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') {
                closeLightbox();
            }
        });
    </script>
</body>

</html>
